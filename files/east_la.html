<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Cell Shading Anime Style Palette & Filters -->
    <style>
      .bg-base { fill: #c7d2d6; }
      .road-base { fill: #9aa3a6; }
      .road-shadow { fill: #6b7578; }
      .sign-blue-base { fill: #1d4ed8; }
      .sign-blue-shadow { fill: #1e3a8a; }
      .sign-blue-highlight { fill: #3b82f6; }
      .pole-base { fill: #94a3b8; }
      .pole-shadow { fill: #475569; }
      .text-white { fill: #f8fafc; font-family: sans-serif; font-weight: bold; }
      .car-dark { fill: #1e293b; }
      .car-light { fill: #e2e8f0; }
      .car-shadow { fill: #0f172a; }
      .anime-outline { stroke: #0f172a; stroke-width: 4px; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    </style>
  </defs>

  <!-- LAYER 1: BACKGROUND & ROAD SURFACE -->
  <g id="Layer-1-Background">
    <rect width="1280" height="720" class="bg-base" />
    <!-- Asphalt Road Area -->
    <polygon points="0,0 1280,0 1280,720 0,720" class="road-base" />
    <!-- Cast Shadow from Sign & Pole -->
    <polygon points="730,720 570,350 630,340 850,720" class="road-shadow" />
  </g>

  <!-- LAYER 2: CARS (MIDGROUND & BACKGROUND) -->
  <g id="Layer-2-Vehicles">
    <!-- Dark Car Bottom Left -->
    <path d="M 0 580 L 180 630 L 250 720 L 0 720 Z" class="car-dark" />
    <path d="M 0 580 L 180 630 L 250 720 L 0 720 Z" class="anime-outline" />

    <!-- Silver/White Car Center -->
    <path d="M 330 380 Q 420 370 570 530 L 580 610 L 350 550 Z" class="car-light" />
    <path d="M 330 380 Q 420 370 570 530 L 580 610 L 350 550 Z" class="anime-outline" />

    <!-- Top Traffic Cars -->
    <path d="M 180 150 L 460 70 L 490 200 L 220 280 Z" class="car-light" />
    <path d="M 180 150 L 460 70 L 490 200 L 220 280 Z" class="anime-outline" />

    <path d="M 460 0 L 630 20 L 610 120 L 450 70 Z" class="car-light" />
    <path d="M 460 0 L 630 20 L 610 120 L 450 70 Z" class="anime-outline" />

    <path d="M 680 40 L 910 0 L 970 80 L 730 130 Z" class="car-light" />
    <path d="M 680 40 L 910 0 L 970 80 L 730 130 Z" class="anime-outline" />

    <path d="M 690 60 L 910 30 L 900 230 L 700 200 Z" class="car-shadow" />
  </g>

  <!-- LAYER 3: SIGN SUPPORT POLE -->
  <g id="Layer-3-Pole">
    <!-- Vertical Sign Post -->
    <path d="M 570 0 L 630 0 L 630 720 L 570 720 Z" class="pole-base" />
    <!-- Cell Shading Split on Pole -->
    <path d="M 600 0 L 630 0 L 630 720 L 600 720 Z" class="pole-shadow" />
    <path d="M 570 0 L 630 0 L 630 720 L 570 720 Z" class="anime-outline" />
  </g>

  <!-- LAYER 4: WELCOME TO EAST LOS ANGELES SIGN -->
  <g id="Layer-4-Signboard">
    <!-- Main Sign Board Body -->
    <path d="M 480 130 
             Q 480 110 500 110 
             L 780 110 
             Q 900 110 930 150 
             L 970 230 
             Q 980 250 960 270 
             L 480 270 
             Q 460 270 460 250 
             Z" class="sign-blue-base" />

    <!-- Cell Shading Lower Half of Sign -->
    <path d="M 460 190 L 960 190 L 960 270 Q 960 270 960 270 L 480 270 Q 460 270 460 250 Z" class="sign-blue-shadow" />

    <!-- Sign Outer Border Outline -->
    <path d="M 480 130 
             Q 480 110 500 110 
             L 780 110 
             Q 900 110 930 150 
             L 970 230 
             Q 980 250 960 270 
             L 480 270 
             Q 460 270 460 250 
             Z" class="anime-outline" />

    <!-- County Seal Emblem on Top Center of Sign -->
    <circle cx="720" cy="115" r="35" class="sign-blue-shadow" />
    <circle cx="720" cy="115" r="35" class="anime-outline" />
    <circle cx="720" cy="115" r="28" class="sign-blue-highlight" />

    <!-- Typography / Wireframe Text Placeholders -->
    <!-- "Welcome to" -->
    <text x="590" y="165" font-size="24" class="text-white" font-style="italic">Welcome to</text>
    
    <!-- "East Los Angeles" (Cursive stylized representation) -->
    <text x="515" y="225" font-size="52" class="text-white" font-family="serif" font-style="italic">East Los Angeles</text>

    <!-- "County of Los Angeles" -->
    <text x="535" y="255" font-size="20" class="text-white" letter-spacing="1px">County of Los Angeles</text>
  </g>

  <!-- LAYER 5: ANIME HIGHLIGHTS & FOREGROUND ACCENTS -->
  <g id="Layer-5-FX-Highlights">
    <!-- Rim Light / Specular highlight on sign edge -->
    <path d="M 482 132 Q 482 113 501 113 L 780 113" stroke="#93c5fd" stroke-width="3" fill="none" />
    <!-- Dynamic Speed Lines / Anime Atmosphere Effect -->
    <line x1="50" y1="50" x2="150" y2="50" stroke="#ffffff" stroke-width="2" opacity="0.4" />
    <line x1="20" y1="90" x2="120" y2="90" stroke="#ffffff" stroke-width="2" opacity="0.3" />
  </g>
</svg>
